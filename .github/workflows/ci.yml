name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Generate deterministic audit artifacts
        run: iris-audit evaluate --input evidence/sample/collector.json --output artifacts/ci_run
      - name: Compare reference artifacts
        run: python scripts/compare_artifacts.py artifacts/sample_run artifacts/ci_run
      - name: Privacy and credential scan
        run: python scripts/privacy_scan.py .
      - name: Verify reviewed evidence images
        run: python scripts/verify_evidence_images.py
      - name: Validate collector syntax
        run: bash -n scripts/collect_security_evidence.sh
      - name: Build hardened offline image
        run: docker build -t iris-agent-security-auditor:ci .
